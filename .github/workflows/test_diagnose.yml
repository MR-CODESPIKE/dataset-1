name: Test Diagnose Endpoint

# Manually triggered -- sends sample requests to the deployed Render backend
# and prints the responses, so you can check the full pipeline is working.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run test script
        run: python test_diagnose.py