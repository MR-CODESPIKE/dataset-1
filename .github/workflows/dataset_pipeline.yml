name: Agri-Vet Dataset Batch & Merge Pipeline

on:
  # Allows manual triggering from the GitHub Actions tab
  workflow_dispatch:
  # Optional: Automatically triggers every 30 minutes to cycle through remaining batches
  schedule:
    - cron: '*/30 * * * *'

jobs:
  process-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Prevents stuck runs from consuming Action minutes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
       

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          echo "Disk space freed for Kaggle downloads."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai huggingface_hub pandas pyarrow kaggle

      - name: Configure Kaggle CLI Credentials
        run: |
          mkdir -p ~/.kaggle
          echo '{"username":"${{ secrets.KAGGLE_USERNAME }}","key":"${{ secrets.KAGGLE_KEY }}"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Run Batch Generation and Merge Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          python generate_dataset_batch.py