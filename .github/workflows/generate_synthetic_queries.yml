name: Generate Synthetic Queries

# Manually triggered from the GitHub Actions tab (or GitHub mobile app) -
# no schedule, since this only needs to rerun when the ground-truth KB changes.
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-genai requests

      - name: Run generation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_synthetic_queries.py

      - name: Upload result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-queries
          path: synthetic_queries.csv

      - name: Commit result back to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add synthetic_queries.csv
          git diff --staged --quiet || git commit -m "Update synthetic_queries.csv [auto]"
          git push